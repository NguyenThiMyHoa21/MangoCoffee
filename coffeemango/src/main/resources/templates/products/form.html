<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Sản phẩm | Coffee Mango</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{layout/sidebar :: sidebar(activePage='products')}"></div>
    <main class="flex-grow-1 main-content">
        <div th:replace="~{layout/topnav :: topnav}"></div>
        <div class="p-4">
            <div class="d-flex align-items-center mb-4 gap-2">
                <a th:href="@{/products}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h4 class="fw-bold mb-0"
                    th:text="${product.id != null} ? 'Cập nhật sản phẩm' : 'Thêm sản phẩm mới'"></h4>
            </div>

            <div class="card border-0 shadow-sm" style="max-width: 600px;">
                <div class="card-body p-4">
                    <form th:action="${product.id != null} ? @{/products/edit/{id}(id=${product.id})} : @{/products/create}"
                          th:object="${product}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên sản phẩm <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                                   placeholder="VD: Cappuccino"/>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mô tả</label>
                            <textarea th:field="*{description}" class="form-control" rows="2"
                                      placeholder="Mô tả ngắn về sản phẩm"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{price}" class="form-control"
                                   th:classappend="${#fields.hasErrors('price')} ? ' is-invalid'"
                                   placeholder="VD: 55000" min="0"/>
                            <div class="invalid-feedback" th:errors="*{price}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Danh mục <span class="text-danger">*</span></label>
                            <select th:field="*{category}" class="form-select">
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}"
                                        th:value="${cat.id}"
                                        th:text="${cat.name}"
                                        th:selected="${product.category != null && product.category.id == cat.id}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <div class="form-check">
                                <input type="checkbox" th:field="*{available}" class="form-check-input" id="available"/>
                                <label class="form-check-label" for="available">Đang bán</label>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-coffee px-4">
                                <i class="bi bi-check-lg me-1"></i>Lưu
                            </button>
                            <a th:href="@{/products}" class="btn btn-outline-secondary px-4">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
