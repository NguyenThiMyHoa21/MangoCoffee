<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nhân viên | Coffee Mango</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{layout/sidebar :: sidebar(activePage='staff')}"></div>
    <main class="flex-grow-1 main-content">
        <div th:replace="~{layout/topnav :: topnav}"></div>
        <div class="p-4">
            <div class="d-flex align-items-center mb-4 gap-2">
                <a th:href="@{/staff}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h4 class="fw-bold mb-0"
                    th:text="${user.id != null} ? 'Cập nhật nhân viên' : 'Thêm nhân viên mới'"></h4>
            </div>
            <div class="card border-0 shadow-sm" style="max-width: 600px;">
                <div class="card-body p-4">
                    <form th:action="${user.id != null} ? @{/staff/edit/{id}(id=${user.id})} : @{/staff/create}"
                          th:object="${user}" method="post">

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{fullName}" class="form-control"
                                       placeholder="Nguyễn Văn A"/>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{username}" class="form-control"
                                       th:readonly="${user.id != null}"
                                       placeholder="nhanvien01"/>
                                <div class="text-danger small" th:if="${#fields.hasErrors('username')}"
                                     th:errors="*{username}"></div>
                            </div>
                        </div>

                        <div class="mb-3" th:if="${user.id == null}">
                            <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" th:field="*{password}" class="form-control"
                                   placeholder="Tối thiểu 6 ký tự"/>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Email</label>
                                <input type="email" th:field="*{email}" class="form-control"
                                       placeholder="email@example.com"/>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Số điện thoại</label>
                                <input type="text" th:field="*{phone}" class="form-control"
                                       placeholder="0901234567"/>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Vai trò</label>
                                <select th:field="*{role}" class="form-select">
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                                </select>
                            </div>
                            <div class="col-6 d-flex align-items-end">
                                <div class="form-check mb-2">
                                    <input type="checkbox" th:field="*{active}" class="form-check-input" id="active"/>
                                    <label class="form-check-label" for="active">Tài khoản hoạt động</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-coffee px-4">
                                <i class="bi bi-check-lg me-1"></i>Lưu
                            </button>
                            <a th:href="@{/staff}" class="btn btn-outline-secondary px-4">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
