<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nhân viên | Coffee Mango</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div class="d-flex w-100">
    <div th:replace="~{layout/sidebar :: sidebar(activePage='staff')}"></div>
    <main class="flex-grow-1 main-content" style="min-width: 0;">
        <div th:replace="~{layout/topnav :: topnav}"></div>
        <div class="p-4">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0"><i class="bi bi-people me-2 text-primary"></i>Quản lý nhân viên</h4>
                <a th:href="@{/staff/create}" class="btn btn-coffee">
                    <i class="bi bi-person-plus me-1"></i>Thêm nhân viên
                </a>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Họ tên</th>
                                <th>Tên đăng nhập</th>
                                <th>Email</th>
                                <th>SĐT</th>
                                <th class="text-center">Vai trò</th>
                                <th class="text-center">Trạng thái</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(staffList)}">
                                <td colspan="8" class="text-center text-muted py-4">Chưa có nhân viên nào</td>
                            </tr>
                            <tr th:each="u, stat : ${staffList}">
                                <td th:text="${stat.index + 1}"></td>
                                <td class="fw-semibold" th:text="${u.fullName}"></td>
                                <td class="text-muted" th:text="${u.username}"></td>
                                <td th:text="${u.email}"></td>
                                <td th:text="${u.phone}"></td>
                                <td class="text-center">
                                    <span class="badge"
                                          th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-danger' : (${u.role.name() == 'MANAGER'} ? 'bg-warning text-dark' : 'bg-secondary')"
                                          th:text="${u.role}"></span>
                                </td>
                                <td class="text-center">
                                    <span th:if="${u.active}" class="badge bg-success">Hoạt động</span>
                                    <span th:unless="${u.active}" class="badge bg-secondary">Tạm ngừng</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/staff/edit/{id}(id=${u.id})}"
                                       class="btn btn-sm btn-outline-primary me-1" title="Chỉnh sửa">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:if="${u.username != 'admin'}"
                                          th:action="@{/staff/delete/{id}(id=${u.id})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('Bạn có chắc chắn muốn XÓA nhân viên này khỏi hệ thống không?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa nhân viên">
                                            <i class="bi bi-trash-fill"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
