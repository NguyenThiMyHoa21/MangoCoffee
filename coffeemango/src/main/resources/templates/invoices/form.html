<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tạo hóa đơn | Coffee Mango</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
    <style>
        .product-item-card {
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1.5px solid #E2E8F0 !important;
            border-radius: 14px;
            background: #FFFFFF;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .product-item-card:hover {
            border-color: #FF6B00 !important;
            background: #FFF7ED;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 0, 0.15);
        }
        .product-item-card:active {
            transform: scale(0.98);
        }
        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1.5px solid #CBD5E1;
            background: white;
            color: #475569;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            line-height: 1;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .qty-btn:hover {
            background: #FF6B00;
            color: white;
            border-color: #FF6B00;
        }
        .order-item-row {
            border-bottom: 1px dashed #E2E8F0;
            padding: 10px 0;
        }
        .cat-pill {
            padding: 5px 12px;
            border-radius: 9999px;
            font-size: 0.78rem;
            font-weight: 600;
            border: 1px solid #E2E8F0;
            background: #FFFFFF;
            color: #64748B;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-pill:hover {
            border-color: #FF6B00;
            color: #FF6B00;
        }
        .cat-pill.active {
            background: linear-gradient(135deg, #FF6B00, #F59E0B);
            border-color: transparent;
            color: #FFFFFF;
            box-shadow: 0 3px 8px rgba(255, 107, 0, 0.25);
        }
    </style>
</head>
<body>
<div class="d-flex w-100">
    <div th:replace="~{layout/sidebar :: sidebar(activePage='invoices')}"></div>
    <main class="flex-grow-1 main-content" style="min-width: 0;">
        <div th:replace="~{layout/topnav :: topnav}"></div>
        <div class="p-4">
            <div class="d-flex align-items-center mb-4 gap-2">
                <a th:href="@{/invoices}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h4 class="fw-bold mb-0">Tạo hóa đơn mới</h4>
            </div>

            <div class="row g-4">
                <!-- Danh sách sản phẩm -->
                <div class="col-xl-7 col-lg-7 col-12">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white fw-semibold pt-3 d-flex justify-content-between align-items-center">
                            <div><i class="bi bi-box-seam me-2" style="color: #FF6B00;"></i>Chọn món từ thực đơn</div>
                            <span class="text-muted small">Bấm vào món để thêm</span>
                        </div>
                        <div class="card-body">
                            <!-- Tìm kiếm & Lọc -->
                            <div class="d-flex gap-2 mb-3">
                                <input type="text" id="searchProduct" class="form-control"
                                       placeholder="🔍 Tìm sản phẩm nhanh..."/>
                            </div>

                            <!-- Category Filter Pills -->
                            <div class="d-flex gap-2 align-items-center mb-3 flex-wrap" id="categoryFilterBar">
                                <button type="button" class="cat-pill active" onclick="filterCategory('all', this)">
                                    <i class="bi bi-grid-fill me-1"></i>Tất cả
                                </button>
                                <button type="button" class="cat-pill" onclick="filterCategory('Cà phê', this)">Cà phê</button>
                                <button type="button" class="cat-pill" onclick="filterCategory('Trà', this)">Trà</button>
                                <button type="button" class="cat-pill" onclick="filterCategory('Nước ép', this)">Nước ép</button>
                                <button type="button" class="cat-pill" onclick="filterCategory('Đồ ăn vặt', this)">Đồ ăn vặt</button>
                            </div>

                            <div class="row g-2" id="productList">
                                <div th:each="p : ${products}" class="col-xl-6 col-lg-12 col-md-6 col-12 product-col"
                                     th:attr="data-category=${p.category.name}">
                                    <div class="product-item-card"
                                         th:attr="data-id=${p.id}, data-name=${p.name}, data-price=${p.price}, data-category=${p.category.name}"
                                         onclick="addItemFromCard(this)">
                                        <div>
                                            <div class="fw-semibold small text-dark" th:text="${p.name}">Tên món</div>
                                            <div class="text-success small fw-bold"
                                                 th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div>
                                            <div class="text-muted" style="font-size:0.7rem;" th:text="${p.category.name}"></div>
                                        </div>
                                        <button type="button" class="btn btn-sm text-white rounded-pill px-2 py-1"
                                                style="background: #FF6B00; font-size: 0.75rem; pointer-events: none;">
                                            <i class="bi bi-plus-lg me-1"></i>Thêm
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Giỏ hàng / Hóa đơn -->
                <div class="col-xl-5 col-lg-5 col-12">
                    <div class="card border-0 shadow-sm" style="position: sticky; top: 80px;">
                        <div class="card-header bg-white fw-semibold pt-3">
                            <i class="bi bi-receipt me-2 text-warning"></i>Chi tiết đơn hàng
                        </div>
                        <div class="card-body">
                            <!-- Danh sách món đã chọn -->
                            <div id="orderItems" class="mb-3" style="min-height: 150px; max-height: 280px; overflow-y: auto;">
                                <div id="emptyMsg" class="text-muted text-center py-5">
                                    <i class="bi bi-cart d-block fs-2 mb-2 opacity-25"></i>
                                    <div>Chưa có sản phẩm nào</div>
                                    <div class="small text-secondary mt-1">Bấm vào món bên trái để thêm vào đơn</div>
                                </div>
                            </div>

                            <hr class="my-2"/>

                            <!-- Tổng tiền -->
                            <div class="d-flex justify-content-between mb-2 small">
                                <span class="text-muted">Tổng cộng:</span>
                                <span class="fw-bold" id="totalAmount">0 đ</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2 align-items-center small">
                                <span class="text-muted">Giảm giá:</span>
                                <div class="input-group input-group-sm" style="width: 130px;">
                                    <input type="number" id="discountInput" class="form-control"
                                           value="0" min="0" oninput="updateTotal()"/>
                                    <span class="input-group-text py-0 small">đ</span>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <span class="fw-bold text-dark">Thành tiền:</span>
                                <span class="fw-bold fs-5 text-success" id="finalAmount">0 đ</span>
                            </div>

                            <!-- Bàn phục vụ -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold small">Bàn phục vụ (Tùy chọn)</label>
                                <select id="tableSelect" class="form-select form-select-sm">
                                    <option value="">-- Mang về / Không chọn bàn --</option>
                                    <option th:each="t : ${tables}" th:value="${t.id}"
                                            th:selected="${selectedTableId != null and selectedTableId == t.id}"
                                            th:text="${t.tableNumber + ' (' + t.location + ')'}">
                                    </option>
                                </select>
                            </div>

                            <!-- Thanh toán -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold small">Phương thức thanh toán</label>
                                <select id="paymentMethod" class="form-select form-select-sm">
                                    <option value="CASH">💵 Tiền mặt</option>
                                    <option value="CARD">💳 Thẻ</option>
                                    <option value="TRANSFER">📱 Chuyển khoản</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold small">Ghi chú</label>
                                <input type="text" id="noteInput" class="form-control form-control-sm"
                                       placeholder="Ghi chú đặc biệt..."/>
                            </div>

                            <button onclick="submitOrder()" class="btn btn-coffee w-100 fw-semibold"
                                    id="submitBtn" disabled>
                                <i class="bi bi-check-circle me-2"></i>Tạo hóa đơn & Thanh toán
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script>
    let orderItems = [];

    // Lọc danh mục
    function filterCategory(catName, btn) {
        document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
        if (btn) btn.classList.add('active');

        document.querySelectorAll('.product-col').forEach(col => {
            const cat = col.getAttribute('data-category');
            if (catName === 'all' || cat === catName) {
                col.style.display = '';
            } else {
                col.style.display = 'none';
            }
        });
    }

    // Tìm kiếm sản phẩm
    const searchInput = document.getElementById('searchProduct');
    if (searchInput) {
        searchInput.addEventListener('input', function () {
            const keyword = this.value.toLowerCase().trim();
            document.querySelectorAll('.product-col').forEach(function (col) {
                const card = col.querySelector('.product-item-card');
                const name = (card ? (card.getAttribute('data-name') || card.dataset?.name || '') : '').toLowerCase();
                col.style.display = name.includes(keyword) ? '' : 'none';
            });
        });
    }

    // Thêm món vào đơn khi bấm vào thẻ
    function addItemFromCard(card) {
        if (!card) return;
        const id = card.getAttribute('data-id') || card.dataset?.id;
        const name = card.getAttribute('data-name') || card.dataset?.name;
        const price = parseFloat(card.getAttribute('data-price') || card.dataset?.price) || 0;

        if (!id || !name) return;

        const existing = orderItems.find(i => String(i.id) === String(id));
        if (existing) {
            existing.qty += 1;
        } else {
            orderItems.push({ id: String(id), name: name, price: price, qty: 1 });
        }
        renderOrder();
    }

    function changeQty(id, delta) {
        const item = orderItems.find(i => String(i.id) === String(id));
        if (item) {
            item.qty += delta;
            if (item.qty <= 0) {
                orderItems = orderItems.filter(i => String(i.id) !== String(id));
            }
        }
        renderOrder();
    }

    function renderOrder() {
        const container = document.getElementById('orderItems');
        const submitBtn = document.getElementById('submitBtn');
        if (!container) return;

        if (orderItems.length === 0) {
            container.innerHTML = `
                <div id="emptyMsg" class="text-muted text-center py-5">
                    <i class="bi bi-cart d-block fs-2 mb-2 opacity-25"></i>
                    <div>Chưa có sản phẩm nào</div>
                    <div class="small text-secondary mt-1">Bấm vào món bên trái để thêm vào đơn</div>
                </div>`;
            if (submitBtn) submitBtn.disabled = true;
            updateTotal();
            return;
        }

        if (submitBtn) submitBtn.disabled = false;
        let html = '';
        orderItems.forEach(item => {
            html += `
            <div class="order-item-row d-flex justify-content-between align-items-center">
                <div class="flex-grow-1 pe-2">
                    <div class="fw-semibold small text-dark">${item.name}</div>
                    <div class="text-muted" style="font-size:0.75rem;">${formatMoney(item.price)} đ</div>
                </div>
                <div class="d-flex align-items-center gap-1">
                    <button type="button" class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
                    <span class="fw-bold" style="min-width:24px;text-align:center;">${item.qty}</span>
                    <button type="button" class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                </div>
                <div class="fw-bold text-success text-end ms-2" style="min-width:75px;font-size:0.85rem;">
                    ${formatMoney(item.price * item.qty)} đ
                </div>
            </div>`;
        });
        container.innerHTML = html;
        updateTotal();
    }

    function updateTotal() {
        const total = orderItems.reduce((sum, i) => sum + i.price * i.qty, 0);
        const discountInput = document.getElementById('discountInput');
        const discount = discountInput ? (parseFloat(discountInput.value) || 0) : 0;
        const final = Math.max(0, total - discount);

        const totalEl = document.getElementById('totalAmount');
        const finalEl = document.getElementById('finalAmount');
        if (totalEl) totalEl.textContent = formatMoney(total) + ' đ';
        if (finalEl) finalEl.textContent = formatMoney(final) + ' đ';
    }

    function formatMoney(n) {
        return (n || 0).toLocaleString('vi-VN');
    }

    function submitOrder() {
        if (orderItems.length === 0) return;

        const discountInput = document.getElementById('discountInput');
        const discount = discountInput ? (parseFloat(discountInput.value) || 0) : 0;
        const paymentMethodEl = document.getElementById('paymentMethod');
        const paymentMethod = paymentMethodEl ? paymentMethodEl.value : 'CASH';
        const noteEl = document.getElementById('noteInput');
        const note = noteEl ? noteEl.value : '';
        const tableSelect = document.getElementById('tableSelect');
        const tableId = (tableSelect && tableSelect.value) ? tableSelect.value : null;
        const total = orderItems.reduce((sum, i) => sum + i.price * i.qty, 0);
        const finalAmount = Math.max(0, total - discount);

        const details = orderItems.map(i => ({
            product: { id: i.id },
            quantity: i.qty,
            unitPrice: i.price,
            subtotal: i.price * i.qty
        }));

        const invoice = {
            tableId: tableId,
            totalAmount: total,
            discount: discount,
            finalAmount: finalAmount,
            paymentMethod: paymentMethod,
            note: note,
            payNow: true,
            details: details
        };

        const submitBtn = document.getElementById('submitBtn');
        if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang tạo...';
        }

        fetch('/invoices/api/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(invoice)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                window.location.href = '/invoices/print/' + data.invoiceId;
            } else {
                alert('Lỗi: ' + data.message);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Tạo hóa đơn & Thanh toán';
                }
            }
        })
        .catch(err => {
            alert('Lỗi kết nối: ' + err);
            if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Tạo hóa đơn & Thanh toán';
            }
        });
    }
</script>
</body>
</html>
