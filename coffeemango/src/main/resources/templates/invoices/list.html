<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Hóa đơn | Coffee Mango</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{layout/sidebar :: sidebar(activePage='invoices')}"></div>
    <main class="flex-grow-1 main-content">
        <div th:replace="~{layout/topnav :: topnav}"></div>
        <div class="p-4">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0"><i class="bi bi-receipt me-2 text-warning"></i>Quản lý hóa đơn</h4>
                <a th:href="@{/invoices/create}" class="btn btn-coffee">
                    <i class="bi bi-plus-lg me-1"></i>Tạo hóa đơn
                </a>
            </div>

            <!-- Filter -->
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body py-2">
                    <form th:action="@{/invoices}" method="get" class="row g-2 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label fw-semibold small">Từ ngày</label>
                            <input type="date" name="from" class="form-control" th:value="${from}"/>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold small">Đến ngày</label>
                            <input type="date" name="to" class="form-control" th:value="${to}"/>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold small">Tìm mã hóa đơn</label>
                            <input type="text" name="keyword" class="form-control"
                                   placeholder="VD: INV-000001" th:value="${keyword}"/>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-coffee w-100">
                                <i class="bi bi-search me-1"></i>Tìm kiếm
                            </button>
                            <a th:href="@{/invoices}" class="btn btn-outline-secondary" title="Đặt lại">
                                <i class="bi bi-arrow-counterclockwise"></i>
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Mã hóa đơn</th>
                                <th>Nhân viên</th>
                                <th class="text-end">Tổng tiền</th>
                                <th>Thanh toán</th>
                                <th class="text-center">Trạng thái</th>
                                <th>Thời gian</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(invoices)}">
                                <td colspan="8" class="text-center text-muted py-4">Không có hóa đơn nào</td>
                            </tr>
                            <tr th:each="inv, stat : ${invoices}">
                                <td th:text="${stat.index + 1}"></td>
                                <td class="fw-semibold text-primary" th:text="${inv.invoiceCode}"></td>
                                <td th:text="${inv.staff != null ? inv.staff.fullName : 'N/A'}"></td>
                                <td class="text-end fw-bold text-success"
                                    th:text="${#numbers.formatDecimal(inv.finalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                <td th:text="${inv.paymentMethod}"></td>
                                <td class="text-center">
                                    <span class="badge"
                                          th:classappend="${inv.status.name() == 'COMPLETED'} ? 'bg-success' : (${inv.status.name() == 'CANCELLED'} ? 'bg-danger' : 'bg-warning text-dark')"
                                          th:text="${inv.status}"></span>
                                </td>
                                <td class="text-muted small"
                                    th:text="${#temporals.format(inv.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td class="text-center">
                                    <a th:href="@{/invoices/detail/{id}(id=${inv.id})}"
                                       class="btn btn-sm btn-outline-info me-1" title="Chi tiết">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/invoices/print/{id}(id=${inv.id})}"
                                       target="_blank"
                                       class="btn btn-sm btn-outline-secondary me-1" title="In hóa đơn">
                                        <i class="bi bi-printer"></i>
                                    </a>
                                    <form th:if="${inv.status.name() == 'PENDING'}"
                                          th:action="@{/invoices/complete/{id}(id=${inv.id})}"
                                          method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-outline-success me-1"
                                                title="Hoàn thành">
                                            <i class="bi bi-check-circle"></i>
                                        </button>
                                    </form>
                                    <form th:if="${inv.status.name() == 'PENDING'}"
                                          th:action="@{/invoices/cancel/{id}(id=${inv.id})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('Hủy hóa đơn này?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Hủy">
                                            <i class="bi bi-x-circle"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
