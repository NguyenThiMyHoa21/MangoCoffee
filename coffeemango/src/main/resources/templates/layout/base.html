<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' | Coffee Mango' : 'Coffee Mango'}">Coffee Mango</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>

<div class="d-flex">
    <!-- Reusable Sidebar -->
    <div th:replace="~{layout/sidebar :: sidebar(activePage=${activePage})}"></div>

    <!-- Main Content Area -->
    <main class="flex-grow-1 main-content">
        <!-- Reusable Topnav -->
        <div th:replace="~{layout/topnav :: topnav}"></div>

        <!-- Page Content Fragment -->
        <div class="p-4">
            <div th:replace="~{${contentFragment}}"></div>
        </div>
    </main>
</div>

<!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
