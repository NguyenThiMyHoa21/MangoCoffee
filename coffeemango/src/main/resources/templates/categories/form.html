<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Danh mục | Coffee Mango</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{layout/sidebar :: sidebar(activePage='categories')}"></div>
    <main class="flex-grow-1 main-content">
        <div th:replace="~{layout/topnav :: topnav}"></div>
        <div class="p-4">
            <div class="d-flex align-items-center mb-4 gap-2">
                <a th:href="@{/categories}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h4 class="fw-bold mb-0"
                    th:text="${category.id != null} ? 'Cập nhật danh mục' : 'Thêm danh mục mới'"></h4>
            </div>
            <div class="card border-0 shadow-sm" style="max-width: 500px;">
                <div class="card-body p-4">
                    <form th:action="${category.id != null} ? @{/categories/edit/{id}(id=${category.id})} : @{/categories/create}"
                          th:object="${category}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên danh mục <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                                   placeholder="VD: Cà phê"/>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mô tả</label>
                            <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-4">
                            <div class="form-check">
                                <input type="checkbox" th:field="*{active}" class="form-check-input" id="active"/>
                                <label class="form-check-label" for="active">Hoạt động</label>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-coffee px-4">
                                <i class="bi bi-check-lg me-1"></i>Lưu
                            </button>
                            <a th:href="@{/categories}" class="btn btn-outline-secondary px-4">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
