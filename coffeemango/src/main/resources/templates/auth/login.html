<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng nhập | Coffee Mango POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFF7ED 0%, #FFEDD5 50%, #FED7AA 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 20px 40px -10px rgba(255, 107, 0, 0.15), 0 10px 20px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            border: 1px solid #FFE4D6;
        }
        .login-header {
            background: linear-gradient(135deg, #FF6B00 0%, #FA5A00 100%);
            padding: 36px 30px 30px;
            text-align: center;
            color: #FFFFFF;
            position: relative;
        }
        .brand-badge {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #FFFFFF;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 12px;
        }
        .form-control {
            border-radius: 12px;
            border: 1.5px solid #E2E8F0;
            padding: 10px 14px;
            font-size: 0.92rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #FF6B00;
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.18);
        }
        .input-group-text {
            border-radius: 12px;
            border: 1.5px solid #E2E8F0;
            background-color: #F8FAFC;
            color: #64748B;
        }
        .btn-login {
            background: linear-gradient(135deg, #FF6B00 0%, #FA5A00 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(255, 107, 0, 0.35);
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #E05D00 0%, #D84E00 100%);
            color: #FFFFFF;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 107, 0, 0.45);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Card Header -->
        <div class="login-header">
            <div class="brand-badge">
                <i class="bi bi-cup-hot-fill"></i>
            </div>
            <h3 class="fw-bold mb-1" style="letter-spacing: -0.02em;">Coffee Mango</h3>
            <p class="text-white-50 small mb-0">Hệ thống Quản lý Quán Cà phê & AI POS</p>
        </div>

        <!-- Card Body -->
        <div class="p-4 p-sm-5">

            <!-- Alerts -->
            <div th:if="${param.error}" class="alert alert-danger py-2 small d-flex align-items-center gap-2 mb-3">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span>Tên đăng nhập hoặc mật khẩu không chính xác!</span>
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2 small d-flex align-items-center gap-2 mb-3">
                <i class="bi bi-check-circle-fill"></i>
                <span>Đã đăng xuất an toàn khỏi hệ thống!</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-secondary">Tên đăng nhập</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" id="usernameInput" class="form-control"
                               placeholder="Nhập tên đăng nhập" required autofocus/>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label fw-semibold small text-secondary mb-0">Mật khẩu</label>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" id="passwordInput" class="form-control"
                               placeholder="Nhập mật khẩu" required/>
                        <button type="button" class="btn btn-outline-secondary" id="togglePassword" style="border-color:#E2E8F0;">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-box-arrow-in-right fs-5"></i>
                    <span>Đăng nhập hệ thống</span>
                </button>
            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');
        if (togglePassword) {
            togglePassword.addEventListener('click', function () {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                eyeIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
            });
        }
    </script>
</body>
</html>
