<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Nguyên liệu | Coffee Mango</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{layout/sidebar :: sidebar(activePage='ingredients')}"></div>
    <main class="flex-grow-1 main-content">
        <div th:replace="~{layout/topnav :: topnav}"></div>
        <div class="p-4">
            <div class="d-flex align-items-center mb-4 gap-2">
                <a th:href="@{/ingredients}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h4 class="fw-bold mb-0"
                    th:text="${ingredient.id != null} ? 'Cập nhật nguyên liệu' : 'Thêm nguyên liệu mới'"></h4>
            </div>
            <div class="card border-0 shadow-sm" style="max-width: 550px;">
                <div class="card-body p-4">
                    <form th:action="${ingredient.id != null} ? @{/ingredients/edit/{id}(id=${ingredient.id})} : @{/ingredients/create}"
                          th:object="${ingredient}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên nguyên liệu <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="VD: Cà phê hạt"/>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Số lượng tồn</label>
                                <input type="number" th:field="*{quantity}" class="form-control"
                                       step="0.001" min="0"/>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Đơn vị</label>
                                <input type="text" th:field="*{unit}" class="form-control" placeholder="kg, lít, cái..."/>
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Mức tối thiểu</label>
                                <input type="number" th:field="*{minQuantity}" class="form-control"
                                       step="0.001" min="0"/>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">Giá nhập / đơn vị (đ)</label>
                                <input type="number" th:field="*{costPerUnit}" class="form-control" min="0"/>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-coffee px-4">
                                <i class="bi bi-check-lg me-1"></i>Lưu
                            </button>
                            <a th:href="@{/ingredients}" class="btn btn-outline-secondary px-4">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
