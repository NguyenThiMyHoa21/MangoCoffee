<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${table.id != null ? 'Sửa bàn' : 'Thêm bàn mới'}">Quản lý bàn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-dark" style="background-color: #8B4513;">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-cup-hot-fill"></i> Coffee Mango
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header" style="background-color: #8B4513; color: white;">
                        <h4 class="mb-0">
                            <i class="bi bi-grid-3x3"></i> 
                            <span th:text="${table.id != null ? 'Sửa bàn' : 'Thêm bàn mới'}">Thêm bàn mới</span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/tables/save}" th:object="${table}" method="post">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="mb-3">
                                <label class="form-label">Số bàn <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" th:field="*{tableNumber}" 
                                       placeholder="VD: Bàn 1" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Khu vực <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{location}" required>
                                    <option value="">-- Chọn khu vực --</option>
                                    <option value="Trong nhà">Trong nhà</option>
                                    <option value="Ngoài sân">Ngoài sân</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Sức chứa (số người) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" th:field="*{capacity}" 
                                       placeholder="VD: 4" min="1" max="20" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Trạng thái <span class="text-danger">*</span></label>
                                <select class="form-select" th:field="*{status}" required>
                                    <option value="AVAILABLE">Trống</option>
                                    <option value="OCCUPIED">Đang có khách</option>
                                    <option value="RESERVED">Đã đặt trước</option>
                                </select>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Lưu
                                </button>
                                <a href="/tables" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Hủy
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
