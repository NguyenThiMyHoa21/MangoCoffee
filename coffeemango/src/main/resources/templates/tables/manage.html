<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Quản lý bàn | Coffee Mango</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body>
<div class="d-flex">
    <div th:replace="~{layout/sidebar :: sidebar(activePage='tables')}"></div>
    <main class="flex-grow-1 main-content">
        <div th:replace="~{layout/topnav :: topnav}"></div>
        <div class="p-4">
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex align-items-center gap-2 mb-4">
                <a th:href="@{/tables}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h4 class="fw-bold mb-0">
                    <i class="bi bi-gear-fill me-2" style="color:#FF6B00;"></i>Quản lý bàn
                </h4>
            </div>

            <div class="row g-4">
                <!-- Form thêm bàn -->
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white fw-semibold pt-3"
                             style="border-bottom:1px solid #f0e0d0;">
                            <i class="bi bi-plus-circle me-2 text-success"></i>Thêm bàn mới
                        </div>
                        <div class="card-body">
                            <form th:action="@{/tables/create}" method="post">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Tên bàn</label>
                                    <input type="text" name="tableNumber" class="form-control"
                                           placeholder="VD: Bàn 11" required/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Sức chứa</label>
                                    <input type="number" name="capacity" class="form-control"
                                           placeholder="VD: 4" min="1" required/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small">Khu vực</label>
                                    <select name="location" class="form-select">
                                        <option value="Trong nhà">Trong nhà</option>
                                        <option value="Ngoài trời">Ngoài trời</option>
                                        <option value="Tầng 2">Tầng 2</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-coffee w-100">
                                    <i class="bi bi-plus-lg me-1"></i>Thêm bàn
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Danh sách bàn -->
                <div class="col-md-8">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white fw-semibold pt-3"
                             style="border-bottom:1px solid #f0e0d0;">
                            <i class="bi bi-list me-2"></i>Danh sách bàn
                            (<span th:text="${#lists.size(tables)}"></span> bàn)
                        </div>
                        <div class="card-body p-0">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Tên bàn</th>
                                        <th class="text-center">Sức chứa</th>
                                        <th>Khu vực</th>
                                        <th class="text-center">Trạng thái</th>
                                        <th class="text-center">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${#lists.isEmpty(tables)}">
                                        <td colspan="5" class="text-center text-muted py-4">Chưa có bàn nào</td>
                                    </tr>
                                    <tr th:each="t : ${tables}">
                                        <td class="fw-semibold" th:text="${t.tableNumber}"></td>
                                        <td class="text-center">
                                            <i class="bi bi-people me-1"></i>
                                            <span th:text="${t.capacity}"></span>
                                        </td>
                                        <td th:text="${t.location}"></td>
                                        <td class="text-center">
                                            <span class="badge"
                                                  th:classappend="${t.status.name() == 'AVAILABLE'} ? 'bg-success' :
                                                                   (${t.status.name() == 'OCCUPIED'} ? 'bg-danger' : 'bg-warning text-dark')"
                                                  th:text="${t.status.name() == 'AVAILABLE'} ? 'Trống' :
                                                             (${t.status.name() == 'OCCUPIED'} ? 'Có khách' : 'Đặt trước')">
                                            </span>
                                        </td>
                                        <td class="text-center">
                                            <form th:action="@{/tables/delete/{id}(id=${t.id})}"
                                                  method="post" class="d-inline"
                                                  onsubmit="return confirm('Xóa bàn này?')">
                                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
